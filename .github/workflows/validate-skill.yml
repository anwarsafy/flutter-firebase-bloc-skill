name: Validate Skill

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate skill structure, manifests, and templates
        run: |
          python3 - <<'EOF'
          import json, os, re

          root = "skills/flutter-firebase-bloc"
          skill_md = os.path.join(root, "SKILL.md")
          assert os.path.isfile(skill_md), "Missing SKILL.md"

          with open(skill_md, "r", encoding="utf-8") as f:
              text = f.read()
          assert text.startswith("---\n") and "\nname:" in text and "\ndescription:" in text, "Invalid SKILL.md frontmatter"

          expected_refs = [
              "architecture-and-di.md",
              "auth-and-security.md",
              "bloc-errors-l10n.md",
              "notifications-and-links.md",
              "flavors-perf-rc-cicd.md",
          ]
          for ref in expected_refs:
              p = os.path.join(root, "references", ref)
              assert os.path.isfile(p) and os.path.getsize(p) > 5000, f"Reference missing or incomplete: {p}"

          json_files = [
              ".claude-plugin/marketplace.json",
              ".claude-plugin/plugin.json",
              os.path.join(root, "templates/.firebaserc"),
              os.path.join(root, "templates/app_en.arb"),
              os.path.join(root, "templates/app_ar.arb"),
              os.path.join(root, "templates/firebase.json"),
              os.path.join(root, "templates/firestore.indexes.json"),
          ]
          for jf in json_files:
              with open(jf, "r", encoding="utf-8") as f:
                  json.load(f)

          with open(os.path.join(root, "templates/app_en.arb"), encoding="utf-8") as f:
              en_keys = {k for k in json.load(f) if not k.startswith("@")}
          with open(os.path.join(root, "templates/app_ar.arb"), encoding="utf-8") as f:
              ar_keys = {k for k in json.load(f) if not k.startswith("@")}
          assert en_keys == ar_keys, f"ARB key mismatch: {en_keys ^ ar_keys}"

          # SKILL.md `name` must match its folder (Agent Skills spec; `npx skills` relies on it).
          m = re.search(r"^name:\s*(\S+)", text, re.M)
          assert m and m.group(1) == os.path.basename(root), "SKILL.md name must match folder name"

          # Every AppLocalizations key used in the references exists in the ARB templates.
          used = set()
          for ref in expected_refs:
              with open(os.path.join(root, "references", ref), encoding="utf-8") as f:
                  used |= set(re.findall(r"\b(?:l|AppLocalizations\.of\([a-zA-Z]+\))\.([a-z][A-Za-z0-9]+)\b", f.read()))
          assert used <= en_keys, f"ARB keys missing: {sorted(used - en_keys)}"

          # Plugin and marketplace versions stay in sync.
          with open(".claude-plugin/plugin.json") as f:
              pv = json.load(f)["version"]
          with open(".claude-plugin/marketplace.json") as f:
              mv = {p["version"] for p in json.load(f)["plugins"]}
          assert mv == {pv}, f"Version mismatch: plugin {pv} vs marketplace {mv}"

          print("All skill validation checks passed!")
          EOF
      - name: Interactive blueprint is generated from the current skill
        run: |
          pip install markdown==3.11 pygments==2.21.0
          python3 scripts/build_blueprint.py
          git diff --exit-code docs/ || (echo "::error::Run python3 scripts/build_blueprint.py and commit docs/" && exit 1)
